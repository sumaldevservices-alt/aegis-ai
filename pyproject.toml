[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "1.0.0"
description = "AEGIS: The AI sysadmin that never sleeps — autonomous AI agent for VPS and server fleet management."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AEGIS Maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncssh>=2.14.0",
    "psutil>=5.9.8",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "textual>=0.52.0",
    "aiogram>=3.4.1",
    "httpx>=0.27.0",
    "anthropic>=0.18.0",
    "PyYAML>=6.0.1",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pyotp>=2.9.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.2",
    "mypy>=1.8.0",
    "pre-commit>=3.6.2",
    "playwright>=1.41.0",
]

[project.scripts]
aegis = "aegis.cli.main:app"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
