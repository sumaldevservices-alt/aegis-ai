description: "Speculative shadow-execution sandbox and blast-radius verifier for autonomous agent tools using ephemeral Git worktrees. Disclosure — creates git worktrees under `<repo>/.aegis/ghostbox/`, adds `.aegis/` to the repo's `.git/info/exclude`, and its fast-forward commit tool applies the shadow worktree's changes to your checkout (paths checked against Aegis' write denylist)."
