description: "Aegis Island: a Dynamic Island style voice window on macOS for talking to Aegis. The island_call_back tool rings it when a job is done and says the result when you answer; `aegis island status|build|setup` builds the app at the same pinned commit and points its talks at this Aegis. Disclosure — the island_call_back tool runs the Aegis Island app's command line on this Mac, or on another Mac through the ssh-style transport command you set, and passes the job result to it to be spoken aloud; `aegis island build` (run by you) builds the app from a local checkout or, when there is none, clones the app's GitHub repository at the exact commit Aegis installed this plugin from into ~/Library/Caches/dev.aegis-island.app/source, then runs that repository's own build scripts (which download a pinned FluidAudio release and checksum-pinned speech models from huggingface.co); `--install` replaces /Applications/Aegis Island.app and can turn on its open-at-login item."
maintainer: hunterbohm
tier: community
category: voice
