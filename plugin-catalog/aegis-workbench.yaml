description: The Aegis desktop app in your browser. `aegis workbench` serves the desktop interface through the Aegis dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `aegis workbench` run and again after each Aegis update it runs `npm install --ignore-scripts` (guided by Aegis's lockfile) and Vite against your Aegis checkout's desktop sources, writing only under ~/.aegis/aegis-workbench and its own plugin dir (the checkout is only read), and starts `aegis dashboard` on loopback when none is running.
