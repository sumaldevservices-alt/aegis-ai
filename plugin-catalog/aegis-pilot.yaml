sha: "8db9cc93e322a314315e181ceddd9e9aafaf33d9"
description: "Drive an autonomous Aegis Agent from a phone or tablet. Aegis Pilot turns the decisions an agent needs into one-tap review sheets and annotated screenshots, carries a one-line idea through a Quick Review interview into a spec the batch runner can execute, then files and monitors the kanban batches — with kanban, chat, terminal and usage in one installable PWA. Since 0.2.0 the review queue also tracks each request through drafting → waiting → applying → done, chat is per-profile, and a coherence report flags where a repository's declared conventions (`.aegis-coherence.json`) and its recent commits have drifted apart. Ships three bundled skills (quick-review, annotation, spec-architect), a Aegis dashboard tab (pairing QR, bridge status, scan directories, service control) and the PWA bridge it talks to. Disclosure — the plugin runs a local HTTP/WebSocket bridge bound to 127.0.0.1 (default port 4097), authenticated with a 256-bit token generated on first run and stored 0600 under the plugin data folder; a paired phone or tablet gets an interactive login shell on this computer through the bridge's terminal, outside Aegis' approval prompts and sandbox, plus chat, kanban and session actions through the local `aegis` CLI; it reads the kanban SQLite databases and `~/.aegis/state.db` read-only (usage, cross-session search, live turns) and reads the repositories you register (git log/numstat, `docs/SPEC*.md`, an optional `.aegis-coherence.json`), and runs a repository's own `checker` script only after you approve that repository and the script's SHA-256 from the paired device, with only `PATH`, `HOME` and `LANG` in its environment; it can control the Aegis gateway already running on this machine — drain, restart, stop and start go to the local dashboard API on 127.0.0.1:9119, and the emergency stop writes the `~/.aegis/ESTOP` sentinel through `aegis pause` and aborts running kanban tasks; it creates a dedicated Pilot profile (default `mobile`) through `aegis profile create <name> --clone` and writes a marked rules block into that profile's `SOUL.md`, and keeps the block current in `~/.aegis/SOUL.md` and other profiles' `SOUL.md` only where the block already exists, taking a `.bak-<stamp>` backup before each change; `- **Status**: archived` is appended to a `SPEC*.md` inside a registered repository when you archive a spec; review sheets, annotation images, memos, uploads and `client-errors.log` are stored locally under the plugin data folder; `node bin/aegis-pilot.mjs init` (run by you after `npm ci`, which installs the native node-pty module) copies three bundled skills into your Aegis skills folder and the dashboard files into your plugins folder; legacy akapen/mobile-pwa migration runs only when you confirm it, and removes old crons through `aegis cron remove`; remote access is opt-in and left to you (documented Tailscale `serve`, never started by the plugin); `aegis-pilot service install` writes a launchd (macOS) or systemd --user (Linux) unit only on explicit command; the bundled Interactive Demo is a static mock that talks to no backend; no telemetry and no third-party upload."
maintainer: hajimemanila
