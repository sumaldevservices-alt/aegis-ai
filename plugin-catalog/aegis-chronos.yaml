name: aegis-chronos
title: Aegis Chronos
repo: "https://github.com/DevTarlow/aegis-chronos"
sha: "b6dba5fb182b076e043c68fa9da74f0c87b42faa"
description: "Time-travel filesystem checkpoints, approval-gated rollback, and a scrubbable Desktop timeline for Aegis Agent. Disclosure — Snapshots the whole working directory, untracked files such as `.env` included, into a shadow git repo at `<workspace>/.aegis/chronos/` before each file-editing or shell tool call. Rollback overwrites workspace files and by default deletes untracked files missing from the snapshot. The model's rollback asks for approval first, but `/chronos`, the dashboard API and the Desktop pane restore without a prompt."
maintainer: DevTarlow
tier: community
category: tools
requires_aegis: ">=0.19.0"
version: "1.0.3"
readme: true
capabilities:
  provides_tools:
    - chronos_snapshot
    - chronos_rollback
    - chronos_diff
    - chronos_list_checkpoints
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
