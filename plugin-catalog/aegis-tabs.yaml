name: aegis-tabs
repo: https://github.com/ai-ag2026/aegis-tabs
sha: 05d4a3c5c224cc1dbe575928f8ca2d04aa3abf55
subdir: aegis-plugin
title: "Aegis in the Browser"
description: "Settings page (in the language set in Aegis, nine languages; incl. which browser Aegis works in and its safety level; loosening must be confirmed in the browser) and guard rails for aegis-tabs, which lets Aegis work in individual tabs of your real, signed-in Chromium browser through an extension and an MCP relay. Disclosure — talks only to the aegis-tabs relay you configure (AEGIS_TABS_RELAY, default 127.0.0.1:8766) with AEGIS_TABS_ADMIN_TOKEN (paths /admin/settings and /admin/select, the latter picks the browser when several are connected); caches the last seen settings in plugin-data/aegis-tabs/settings.json and its own opt-in switch in plugin-data/aegis-tabs/options.json; the pre_tool_call hook rejects the tabs tools while switched off and, only if the user turns that switch on, blocked sites in Aegis' own browser tools and web_extract. No shell, no background processes, no telemetry."
maintainer: ai-ag2026
tier: community
category: tools
requires_aegis: ">=0.22.5"
docs_url: https://github.com/ai-ag2026/aegis-tabs#readme
version: "0.4.1"
platforms: []
known_issues:
  - Needs the aegis-tabs relay and browser extension from the same repository, and the relay registered as the MCP server named tabs. The plugin alone does nothing.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - AEGIS_TABS_ADMIN_TOKEN
