description: "Call your Aegis from your phone and let it call you back, through the Twring app (iPhone and Android): live two-way voice calls and typed chat in one Aegis conversation, dangerous-command approvals answered by voice or tap through Aegis's own approval card, and a phone ring when a scheduled job delivers. Twring does the speech; Aegis keeps its model, memory and tools. Disclosure — while the gateway runs, one outbound WebSocket to the linked Twring server (api.twring.com by default, or the TWRING_SERVER you set) carries call and chat turn text in, and Aegis's replies, approval questions (command preview and reason) and cron results out, plus the name and success or failure of each tool Aegis runs while a call or chat turn is in progress (never its arguments or output; Aegis's tool hooks are global, so a tool another chat runs at the same moment can be reported too; the pre_tool_call and post_tool_call hooks never block or change a tool); anyone signed in to the linked Twring account drives this Aegis as its owner and can approve one dangerous command at a time by voice or tap through Aegis's own approval card; HTTPS calls to the same server link the account (sending this computer's hostname as its name), post replies to the chat and ring the phone (cron results ring by default; TWRING_RING_ON_DELIVERY=false turns it off); one link token (TWRING_TOKEN), saved by `aegis twring link` through Aegis's .env route; no files of its own, no shell commands, no telemetry, no self-update."
docs_url: https://github.com/saasagelabs/twring/blob/c7f00ccf32392a68a5d2a9dffa1a1c01e8e1d188/integrations/aegis/README.md
